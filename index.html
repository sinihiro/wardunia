h+=`<div class="pick" style="margin:0 4px 26px">${ow.map(li=>`<button class="pk ${SEL===li?"on":""}" data-sel="${li}">${mon(li,S.pets[li].st,48)}${nameOf(li)}${S.line===li?"<br><small>zdobywa XP</small>":""}</button>`).join("")}</div>`;
const li=SEL,q=S.pets[li],l=LINES[li],lv=frLv(q),nx=FRT[lv+1],c=cr(li),nm=nameOf(li),msg=SAY||IDLE[lv][(new Date().getDate()+li)%2].replace("{n}",nm);
let pn=`<div style="display:flex;gap:14px;align-items:center"><div class="mon" style="width:84px;height:84px">${mon(li,q.st,64)}</div><div style="flex:1;min-width:0"><h2 class="px" style="font-size:11px">${nm}</h2><div class="sub">${["Jajko","Maluch","Forma środkowa","Forma końcowa"][q.st]}</div><div class="sub" style="margin-top:6px">${FRN[lv]}, ${q.fr}${nx?"/"+nx:""} serduszek</div><div class="bar"><i style="width:${nx?Math.round((q.fr-FRT[lv])/(nx-FRT[lv])*100):100}%"></i></div></div></div><div style="margin:16px 0;font-size:15px">${msg}</div>`;
if(q.st){pn+=`<div class="acts"><button class="btn pb" data-care="feed">Nakarm (${3-c.f})</button><button class="btn pb" data-care="play">Pobaw się (${2-c.p})</button><button class="btn pb" data-care="pat">Pogłaszcz (${5-c.h})</button></div>`+(FEED?`<div class="foods">`+FOODS.map((f,i)=>`<button class="row pb" data-food="${i}">${spr(SP[f[1]],26)}${f[0]}</button>`).join("")+`</div>`:"")+`<div class="sub" style="margin-top:8px">Ulubiony przysmak: ${q.fd?FOODS[l.fv][0]:"???"}</div>`}
else pn+=`<div class="sub">To jajko jeszcze śpi. Zdobywaj dla niego XP i spełnij kamień milowy, a się wykluje.</div>`;
if(q.st<3){const need=THR[q.st],m=l.ms[q.st],v=msVal(li,q.st),ce=canEvo(li);
pn+=`<div class="note pb" style="margin:20px 4px 14px"><b>${q.st?"Następna ewolucja":"Wykluwanie"}</b><br>XP: ${Math.min(q.xp,need)}/${need}<br>Kamień milowy: ${MSL[m[0]](m[1])} (${Math.min(v,m[1])}/${m[1]})</div><button class="btn pb" data-evo="${li}" ${ce?"":"disabled"}>${q.st?"Ewoluuj":"Wykluj"}</button>`}
pn+=S.line===li?`<div class="chip px" style="display:inline-block;margin:14px 4px 0">Zdobywa XP</div>`:`<div><button class="btn pb alt" data-partner="${li}" style="margin-top:14px">Niech ten potworek zdobywa XP</button></div>`;
h+=`<div class="card pb">${pn}</div>`;
const free=LINES.map((_,i)=>i).filter(i=>!S.pets[i]),ready=ow.every(i=>S.pets[i].st>0);
if(free.length)h+=`<div class="sec"><h3 class="px">Nowe jajko</h3></div><div class="card pb">`+(ready?`<div class="sub" style="margin-bottom:14px;font-size:15px">Możesz adoptować kolejne jajko. Od razu zacznie zdobywać Twoje XP.</div><div class="pick">${free.map(i=>`<button class="pk" data-adopt="${i}">${spr(SP["egg"+LINES[i].e],56,"",{P:LINES[i].P,L:LINES[i].L})}${LINES[i].en}</button>`).join("")}</div>`:`<div class="sub" style="font-size:15px">Wykluj najpierw obecne jajko, wtedy będzie można adoptować kolejne.</div>`)+`</div>`;
return h}
function stopPen(){if(raf)cancelAnimationFrame(raf);raf=null}
function startPen(){stopPen();const pen=document.getElementById("pen");if(!pen)return;
const W=pen.clientWidth||320,H=pen.clientHeight||300,els=Array.prototype.slice.call(pen.querySelectorAll(".pet.walk")),R=Math.random;
const pt=()=>({x:R()*(W-58),y:H*.36+R()*(H*.64-64)});
const put=(e,q,t)=>{e.style.transform="translate("+q.x+"px,"+(q.y+(q.m?Math.sin(t/110)*2:0))+"px)";e.style.zIndex=Math.round(q.y);e.querySelector(".pi").style.transform=q.d<0?"scaleX(-1)":""};
els.forEach(e=>{const li=+e.dataset.pet;if(!PEN[li]){const a=pt(),b=pt();PEN[li]={x:a.x,y:a.y,tx:b.x,ty:b.y,w:R()*2,d:1,m:0}}put(e,PEN[li],0)});
if(S.cfg.calm==="1"||(typeof matchMedia==="function"&&matchMedia("(prefers-reduced-motion:reduce)").matches)||!els.length)return;
let last=performance.now();
const step=t=>{const dt=Math.min(.05,(t-last)/1000);last=t;els.forEach(e=>{const q=PEN[+e.dataset.pet];if(q.w>0){q.w-=dt;q.m=0}else{const dx=q.tx-q.x,dy=q.ty-q.y,L=Math.hypot(dx,dy),sp=24*dt;q.m=1;if(L<=sp){q.x=q.tx;q.y=q.ty;const n=pt();q.tx=n.x;q.ty=n.y;q.w=1+R()*3;q.m=0}else{q.x+=dx/L*sp;q.y+=dy/L*sp;if(Math.abs(dx)>2)q.d=dx<0?-1:1}}put(e,q,t)});raf=requestAnimationFrame(step)};
raf=requestAnimationFrame(step)}
function burst(li){const pen=document.getElementById("pen");if(!pen)return;const e=pen.querySelector(`[data-pet="${li}"]`);if(!e)return;const r=e.getBoundingClientRect(),p=pen.getBoundingClientRect(),h=document.createElement("i");h.className="hp";h.style.left=(r.left-p.left+r.width/2-9)+"px";h.style.top=(r.top-p.top-8)+"px";h.innerHTML=spr(SP.heart,18);pen.appendChild(h);setTimeout(()=>h.remove(),1000)}
function applyCfg(){const c=S.cfg,r=document.documentElement;r.dataset.skin=c.skin;if(c.mode==="auto")delete r.dataset.theme;else r.dataset.theme=c.mode;r.classList.toggle("calm",c.calm==="1");
const set={hearts:[SP.heart],stars:[SP.star],mix:[SP.heart,SP.star]}[c.fx]||[];
document.getElementById("fx").innerHTML=set.length?Array.from({length:14},(_,i)=>`<i style="left:${(i*37+11)%96}%;animation-duration:${14+(i*5)%11}s;animation-delay:-${(i*3)%14}s">${spr(set[i%set.length],i%3?14:20)}</i>`).join(""):""}
function viewSos(){const u=D(today()).u||0;
return `<div class="top px">Kryzys</div>`+hero()+`<div class="card pb"><h2 style="font-size:20px">Masz ochotę sprawdzić, co u niego?</h2><p class="sub" style="font-size:15px;margin:8px 0 0">To normalne i to minie. Pokusa działa jak fala: rośnie, a potem opada. Przeczekaj ją tutaj.</p><div class="breath" id="breath">Gotowa?</div><div style="text-align:center"><button class="btn pb" id="bstart">Oddychaj ze mną</button></div></div>
<div class="sec"><h3 class="px">Zrób zamiast tego</h3></div><div class="chips">${ALT.map(a=>`<span class="row pb">${a}</span>`).join("")}</div>
<div class="card pb" style="text-align:center"><div class="sub" style="margin-bottom:12px">Dziś oparte pokusie: <b style="color:var(--ink)">${u}</b></div><button class="btn pb" id="resist">Oparłam się! +15 XP</button></div>`}
function stopB(){clearInterval(bt);bt=null}
function startB(){stopB();const el=document.getElementById("breath");if(!el)return;let p=0;const f=()=>{if(!document.getElementById("breath")){stopB();return}if(p%2===0){el.className="breath in";el.textContent="Wdech"}else{el.className="breath out";el.textContent="Wydech"}p++};f();bt=setInterval(f,5000)}
function bump(b){const li=S.line,q=S.pets[li];if(!q)return;const r0=canEvo(li);q.xp=Math.max(0,q.xp+totalXp()-b);save();if(!r0&&canEvo(li))toast("Gotowy do ewolucji! Zajrzyj do Zagrody")}
const TABS=[["dzis",SP.ball,"Dziś"],["zagroda",SP.egg0,"Zagroda"],["mapa",SP.star,"Przygoda"],["sos",SP.heart,"Kryzys"],["profil",FB.concat(FM[1],FT),"Profil"]];
function nav(){const n=document.getElementById("nav");n.innerHTML=TABS.map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?"on":""}">${spr(t[1],26)}${t[2]}</button>`).join("");n.querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;edit=false;stopB();render();window.scrollTo(0,0)})}
function bind(){const $=id=>document.getElementById(id);
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{D(today()).m=+b.dataset.m;save();render()});
document.querySelectorAll("[data-task]").forEach(b=>b.onclick=()=>{const d=D(today()),i=+b.dataset.task,x=totalXp(),was=cnt(d.t)>=NEED;d.t[i]=!d.t[i];save();if(!was&&cnt(d.t)>=NEED)toast("Dzień zaliczony! Złapałaś odznakę");else if(d.t[i])toast("+15 XP");bump(x);render()});
document.querySelectorAll("[data-rk]").forEach(b=>b.onclick=()=>{const d=D(today());d.rk=!d.rk;save();if(d.rk)toast("Dotrzymane, tak trzymaj");render()});
document.querySelectorAll("[data-line]").forEach(b=>b.onclick=()=>{S.line=+b.dataset.line;S.pets[S.line]={st:0,xp:0,fr:0,fd:0};SEL=S.line;save();toast("Wybrano: "+LINES[S.line].en);render()});
document.querySelectorAll("[data-wp]").forEach(b=>b.onclick=()=>{const g=wkOf(wiNow()).goals[+b.dataset.wp],x=totalXp();if(g.c>=g.n)return;g.c++;if(g.c>=g.n){g.dk=today();D(g.dk).w=(D(g.dk).w||0)+1;toast("Cel tygodnia zrobiony! +40 XP")}save();bump(x);render()});
document.querySelectorAll("[data-wm]").forEach(b=>b.onclick=()=>{const g=wkOf(wiNow()).goals[+b.dataset.wm],x=totalXp();if(g.c<=0)return;if(g.c>=g.n&&g.dk&&S.days[g.dk]){S.days[g.dk].w=Math.max(0,(S.days[g.dk].w||0)-1);delete g.dk}g.c--;save();bump(x);render()});
document.querySelectorAll("[data-wd]").forEach(b=>b.onclick=()=>{const w=wkOf(wiNow()),j=+b.dataset.wd,g=w.goals[j],x=totalXp();if(g.c>=g.n&&g.dk&&S.days[g.dk])S.days[g.dk].w=Math.max(0,(S.days[g.dk].w||0)-1);w.goals.splice(j,1);save();bump(x);render()});
if($("wadd"))$("wadd").onclick=()=>{const t=$("wnew").value.trim();if(!t)return;wkOf(wiNow()).goals.push({t:t,n:Math.min(7,Math.max(1,+$("wn").value||1)),c:0});save();render()};
document.querySelectorAll("[data-intro]").forEach(b=>b.onclick=()=>{if(b.dataset.intro==="skip"||IS>=INTRO.length-1){S.intro=1;save()}else IS++;render();window.scrollTo(0,0)});
document.querySelectorAll("[data-sel],[data-pet]").forEach(b=>b.onclick=()=>{SEL=+(b.dataset.sel!=null?b.dataset.sel:b.dataset.pet);SAY="";FEED=false;render()});
document.querySelectorAll("[data-care]").forEach(b=>b.onclick=()=>{const li=SEL,c=cr(li),k=b.dataset.care,n=nameOf(li);
if(k==="feed"){FEED=!FEED;render();return}
if(k==="play"){if(c.p>=2)SAY=n+" jest już zmęczone zabawą. Wróć jutro.";else{c.p++;hearts(li,5);SAY=n+" świetnie się bawi! +5 serduszek"}}
else{if(c.h>=5)SAY=n+" ma dziś dosyć głaskania.";else{c.h++;hearts(li,1);SAY=n+" mruczy z zadowolenia. +1 serduszko"}}
save();render();burst(li)});
document.querySelectorAll("[data-food]").forEach(b=>b.onclick=()=>{const li=SEL,c=cr(li),f=+b.dataset.food,q=S.pets[li],n=nameOf(li);FEED=false;
if(c.f>=3)SAY=n+" jest najedzone na dziś.";else{c.f++;const fav=f===LINES[li].fv;hearts(li,fav?6:3);if(fav)q.fd=1;SAY=fav?n+" uwielbia to! Ulubiony przysmak odkryty. +6 serduszek":n+" zjada ze smakiem. +3 serduszka"}
save();render();burst(li)});
document.querySelectorAll("[data-evo]").forEach(b=>b.onclick=()=>{const li=+b.dataset.evo,q=S.pets[li];if(!canEvo(li))return;q.st++;save();toast((q.st===1?"Wykluło się: ":"Ewolucja! ")+sn(q.st,li));render();burst(li)});
document.querySelectorAll("[data-partner]").forEach(b=>b.onclick=()=>{S.line=+b.dataset.partner;save();toast("Ten potworek zdobywa teraz XP");render()});
document.querySelectorAll("[data-adopt]").forEach(b=>b.onclick=()=>{const li=+b.dataset.adopt;S.pets[li]={st:0,xp:0,fr:0,fd:0};S.line=li;SEL=li;save();toast("Nowe jajko w gnieździe! Teraz ono zdobywa XP");render()});
document.querySelectorAll("[data-cfg]").forEach(b=>b.onclick=()=>{S.cfg[b.dataset.cfg]=b.dataset.v;save();applyCfg();render()});
if($("pname"))$("pname").oninput=e=>{S.name=e.target.value;save()};
if($("mnote"))$("mnote").oninput=e=>{D(today()).n=e.target.value;save()};
document.querySelectorAll("[data-adv]").forEach(b=>b.onclick=()=>{const d=D(today()),x=totalXp();d.s=!d.s;save();if(d.s)toast("Przygoda ukończona! +25 XP");bump(x);render()});
if($("reroll"))$("reroll").onclick=()=>{const d=D(today()),i=Math.min(Math.max(dayIdx(today()),1),DAYS);d.a=((d.a!=null?d.a:i-1)+7)%DAYS;save();render()};
if($("edon"))$("edon").onclick=()=>{edit=true;render()};
if($("edok"))$("edok").onclick=()=>{document.querySelectorAll("input.ed").forEach(i=>{const v=i.value.trim();if(v)S.tasks[+i.dataset.i]=v});save();edit=false;render()};
if($("reset"))$("reset").onclick=()=>{if(!arm){arm=true;render();return}arm=false;S={start:today(),tasks:S.tasks,line:S.line,cfg:S.cfg,name:S.name,intro:1,pets:S.line!=null?{[S.line]:{st:0,xp:0,fr:0,fd:0}}:{},days:{}};save();render()};
if($("bstart"))$("bstart").onclick=startB;
if($("resist"))$("resist").onclick=()=>{const x=totalXp(),d=D(today());d.u=(d.u||0)+1;save();toast("Fala opadła. +15 XP");bump(x);render()}}
function render(){const nv=document.querySelector("nav");if(S.line==null){nv.style.display="none";document.getElementById("app").innerHTML=(S.intro?`<div class="top px">Trenerka Serca</div>`+viewPick():viewIntro());bind();return}
nv.style.display="";nav();document.getElementById("app").innerHTML=({dzis:viewToday,zagroda:viewZagroda,mapa:viewMap,sos:viewSos,profil:viewProfile})[tab]();bind();if(tab==="zagroda")startPen();else stopPen()}
load();applyCfg();render();
</script>
</body>
</html>
